<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6fb">
  <title>Kỹ năng của tôi</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #182033;
      background: #f4f6fb;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background:
        radial-gradient(circle at 10% 10%, rgb(99 102 241 / 9%), transparent 28rem),
        radial-gradient(circle at 90% 90%, rgb(14 165 233 / 8%), transparent 26rem),
        #f4f6fb;
    }

    .skills-card {
      width: min(100%, 620px);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid rgb(226 232 240 / 85%);
      border-radius: 24px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 24px 70px rgb(31 41 55 / 10%);
    }

    .eyebrow {
      margin: 0 0 10px;
      color: #6366f1;
      font-size: 0.75rem;
      font-weight: 750;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 5vw, 2.4rem);
      letter-spacing: -0.045em;
    }

    .intro {
      margin: 12px 0 34px;
      color: #687187;
      line-height: 1.65;
    }

    .skill-list {
      display: grid;
      gap: 25px;
    }

    .skill-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 10px;
      font-size: 0.95rem;
      font-weight: 650;
    }

    .skill-value {
      color: #687187;
      font-variant-numeric: tabular-nums;
      font-size: 0.875rem;
    }

    .progress-track {
      height: 11px;
      overflow: hidden;
      border-radius: 999px;
      background: #e9edf5;
    }

    .progress-fill {
      width: 0;
      height: 100%;
      border-radius: inherit;
      background: linear-gradient(90deg, #6366f1, #8b5cf6);
      animation: fill-progress 2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-origin: left;
    }

    .skill:nth-child(2) .progress-fill {
      background: linear-gradient(90deg, #0ea5e9, #38bdf8);
    }

    .skill:nth-child(3) .progress-fill {
      background: linear-gradient(90deg, #10b981, #34d399);
    }

    .skill:nth-child(4) .progress-fill {
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
    }

    @keyframes fill-progress {
      from {
        width: 0;
      }

      to {
        width: var(--level);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .progress-fill {
        animation-duration: 0.01ms;
      }
    }
  </style>
</head>
<body>
  <main class="skills-card">
    <p class="eyebrow">Hồ sơ cá nhân</p>
    <h1>Kỹ năng của tôi</h1>
    <p class="intro">Một vài thế mạnh mình đã tích lũy trong quá trình học tập và làm việc.</p>

    <section class="skill-list" aria-label="Mức độ kỹ năng">
      <div class="skill">
        <div class="skill-heading">
          <span id="html-label">HTML &amp; CSS</span>
          <span class="skill-value">90%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-labelledby="html-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="90">
          <div class="progress-fill" style="--level: 90%"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-heading">
          <span id="javascript-label">JavaScript</span>
          <span class="skill-value">80%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-labelledby="javascript-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="80">
          <div class="progress-fill" style="--level: 80%"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-heading">
          <span id="design-label">UI / UX Design</span>
          <span class="skill-value">70%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-labelledby="design-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="70">
          <div class="progress-fill" style="--level: 70%"></div>
        </div>
      </div>

      <div class="skill">
        <div class="skill-heading">
          <span id="responsive-label">Responsive Design</span>
          <span class="skill-value">85%</span>
        </div>
        <div class="progress-track" role="progressbar" aria-labelledby="responsive-label" aria-valuemin="0" aria-valuemax="100" aria-valuenow="85">
          <div class="progress-fill" style="--level: 85%"></div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
